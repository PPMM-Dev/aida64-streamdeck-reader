<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover">
    <meta name=apple-mobile-web-app-capable content=yes>
    <meta name=apple-mobile-web-app-status-bar-style content=black>
    <title>com.ppmm.test.tool Settings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/barraider/streamdeck-easypi@latest/src/sdpi.css">
    <script src="https://cdn.jsdelivr.net/gh/barraider/streamdeck-easypi@latest/src/sdtools.common.js"></script>
    <script src="SenSorReaderKeyActionPI.js"></script>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item" id="dynamic_sensor_div">
            <div class="sdpi-item-label">Sensors List</div>
            <select class="sdpi-item-value select sdProperty sdList"
                    id="sensors"
                    oninput="setSettings()"
                    sdListTextProperty="sensorName"
                    sdListValueProperty="sensorName"
                    sdValueField="sensorValue">
                <option value="default">Select Sensor</option>
            </select>
        </div>

        <div class="sdpi-item" id="sensor_refresh_div">
            <div class="sdpi-item-label">Refresh Sensors List</div>
            <button class="sdpi-item-value" onclick="refreshSensorsList()">Refresh</button>
        </div>

    </div>
</body>
</html>
